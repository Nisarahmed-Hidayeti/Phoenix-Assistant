[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[project.scripts]
phoenix-assistant = "phoenix.gui:main"

[tool.setuptools]
packages = ["phoenix"]
